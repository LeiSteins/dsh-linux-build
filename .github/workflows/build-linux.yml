name: Build and publish DSH Linux

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 上游 Release 标签，留空使用最新发布版本
        type: string
        required: false
      release_revision:
        description: Linux 发布修订号，留空自动选择
        type: string
        required: false
      publish:
        description: 发布到 GitHub Releases
        type: boolean
        default: true
      rebuild:
        description: 已发布且资产齐全时仍重新构建，产物保留在 Actions
        type: boolean
        default: false
      overwrite:
        description: 重新构建并覆盖已公开 Release 的全部资产（隐含发布）
        type: boolean
        default: false
  schedule:
    # 00:00 Beijing time (16:00 UTC on the previous calendar day).
    - cron: "0 16 * * *"

permissions:
  contents: read

concurrency:
  group: linux-desktop-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Select upstream release
    runs-on: ubuntu-24.04
    outputs:
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}
      release_revision: ${{ steps.release.outputs.release_revision }}
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      should_build: ${{ steps.release.outputs.should_build }}
      promote_existing: ${{ steps.release.outputs.promote_existing }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Find upstream version and check local assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
          RELEASE_REVISION: ${{ inputs.release_revision }}
          REBUILD: ${{ inputs.rebuild }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: scripts/resolve-release.sh

  build:
    name: Build Linux ${{ matrix.package_arch }} packages
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            package_arch: amd64
            runner: ubuntu-24.04
            timeout: 90
          - arch: arm64
            package_arch: arm64
            runner: ubuntu-24.04-arm
            timeout: 180
    steps:
      - name: Check out packaging repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out upstream release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.resolve.outputs.revision }}
          path: upstream
          persist-credentials: false
      - name: Read upstream Node.js pin
        id: toolchain
        run: |
          version=$(jq -er '.nodeVersion | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' upstream/scripts/primary-runtime/lock.json)
          printf 'node=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: upstream/package.json
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential rpm xz-utils zstd libarchive-tools libgtk-3-0t64 libgbm1 libasound2t64 libcups2t64 \
            libnss3 libxss1 libxtst6 libnotify4 libsecret-1-0 xdg-utils fonts-liberation
      - name: Build and verify DEB, RPM, AppImage and Arch packages
        env:
          DSH_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
          RELEASE_REVISION: ${{ needs.resolve.outputs.release_revision }}
          UPSTREAM_REVISION: ${{ needs.resolve.outputs.revision }}
        run: scripts/build-linux.sh upstream "$UPSTREAM_TAG" dist "$RELEASE_REVISION"
      - name: Upload verified packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dsh-linux-${{ needs.resolve.outputs.version }}-${{ matrix.package_arch }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish verified packages
    needs: [resolve, build]
    if: >-
      ${{ !cancelled() && needs.resolve.result == 'success'
          && (github.event_name == 'schedule' || inputs.publish || inputs.overwrite)
          && (needs.build.result == 'success'
              || (needs.build.result == 'skipped' && needs.resolve.outputs.promote_existing == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.build.result == 'success'
        with:
          pattern: dsh-linux-${{ needs.resolve.outputs.version }}-*
          path: artifacts
      - name: Assemble the release from both architectures
        if: needs.build.result == 'success'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            dir="artifacts/dsh-linux-$VERSION-$arch"
            cat "$dir/SHA256SUMS" >> dist/SHA256SUMS
            mv -- "$dir"/dsh-linux-* dist/
          done
      - name: Publish or promote the release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.upstream_tag }}
          RELEASE_REVISION: ${{ needs.resolve.outputs.release_revision }}
          UPSTREAM_REVISION: ${{ needs.resolve.outputs.revision }}
          OVERWRITE: ${{ inputs.overwrite }}
          ARTIFACT_DIR: ${{ needs.build.result == 'success' && 'dist' || '' }}
        run: scripts/publish-release.sh "$ARTIFACT_DIR"
